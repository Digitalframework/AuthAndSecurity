<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card">
    <h1>Sign in</h1>

    <p class="error" th:if="${message}" th:text="${message}"></p>

    <!--/* Posts to the URL Spring Security's GenerateOneTimeTokenFilter listens on.
            The field must be named "username" — that is the parameter its request
            resolver reads. CSRF is on, so the token goes along as a hidden field. */-->
    <form class="stack" method="post" th:action="@{/ott/generate}">
        <input class="field"
               type="email"
               name="username"
               required
               autofocus
               maxlength="254"
               autocomplete="email"
               placeholder="you@example.com">
        <button class="btn btn-primary" type="submit">Email me a sign-in link</button>
    </form>

    <div class="divider">or</div>

    <a class="btn btn-block" th:href="@{/oauth2/authorization/google}">Sign in with Google</a>
</main>
</body>
</html>
