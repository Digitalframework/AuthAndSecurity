spring.application.name=AuthAndSecurity

# Optional local override file, ignored by git. Handy on Windows if you would
# rather not set real environment variables. See .env.example.
spring.config.import=optional:file:.env[.properties]

# --- Google OAuth2 login -----------------------------------------------------
# Credentials are read from the environment: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
# Startup fails fast if they are missing.
# Endpoint URLs (authorization, token, JWK set, user-info) come from Spring's
# built-in "google" provider defaults, so they do not need to be declared here.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Resolves to http://localhost:8080/login/oauth2/code/google when running locally.
# This exact URL must be registered as an authorized redirect URI in Google Cloud Console.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}