spring.application.name=AuthAndSecurity

# Optional local override file, ignored by git. Handy on Windows if you would
# rather not set real environment variables. See .env.example.
spring.config.import=optional:file:.env[.properties]

# --- Database ----------------------------------------------------------------
# PostgreSQL. Only the password is read from the environment (DB_PASSWORD, which
# can live in .env) — startup fails fast if it is missing, exactly as the Google
# credentials below do. Host, port, database and user have defaults matching a
# stock local install and can be overridden the same way.
#
# connectTimeout is in seconds. sslmode=prefer means "encrypt if the server offers
# it", so a local server without TLS still connects; anything reachable over a
# network wants require instead.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Security}?connectTimeout=10&sslmode=prefer
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Creates and migrates app_user, app_user_permission and issued_token on startup.
# Fine while the schema is still moving; anything long-lived wants Flyway or
# Liquibase and this set to validate.
spring.jpa.hibernate.ddl-auto=update

# --- Google OAuth2 login -----------------------------------------------------
# Credentials are read from the environment: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
# Startup fails fast if they are missing.
# Endpoint URLs (authorization, token, JWK set, user-info) come from Spring's
# built-in "google" provider defaults, so they do not need to be declared here.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Resolves to http://localhost:8080/login/oauth2/code/google when running locally.
# This exact URL must be registered as an authorized redirect URI in Google Cloud Console.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# --- Emailed sign-in link (one-time token) -----------------------------------
# SMTP settings are deliberately not declared here. Spring Boot only builds a
# JavaMailSender when spring.mail.host is set, and that is exactly how the app
# decides whether to email links or just log them (see OneTimeTokenConfig). Giving
# the property an empty default would make it "present" and break that test, so
# configure spring.mail.* in .env or the environment instead. See .env.example.
#
# Defaults live in OneTimeTokenProperties; override any of them here or in .env:
#   app.ott.ttl=10m
#   app.ott.resend-cooldown=60s
#   app.ott.max-per-window=5
#   app.ott.window=1h
#   app.ott.retention=24h
#   app.ott.from=no-reply@example.com
#
# Absolute base URL the emailed links are built against. Unset, they are built
# from the incoming request, which is right locally but wrong behind a proxy that
# sends no forwarded headers — the link would name an internal host:
#   app.ott.base-url=https://app.example.com
#
# Who may sign in. Leave both unset and any mailbox that can receive a link gets
# in — there is no user registry behind this login. Set either one and everyone
# else is refused, without being told so:
#   app.ott.allowed-emails[0]=sam@example.com
#   app.ott.allowed-domains[0]=example.com

# --- Who may register ---------------------------------------------------------
# The allowlist above gates registration too: an address it turns away cannot be
# sent a confirmation link either, and is refused the same way — with a response
# identical to a success, so the form gives away nothing about who is on the list.

# --- Buying tokens with PayPal -------------------------------------------------
# Credentials come from a REST app created at developer.paypal.com (Apps &
# Credentials -> Sandbox). Unlike the Google ones above these are NOT written as
# ${...} here, because they are optional: leaving them unset disables buying
# tokens rather than stopping startup, and the endpoints then answer with an
# error instead of quietly handing out tokens for free. Set them in .env:
#   app.paypal.client-id=...
#   app.paypal.client-secret=...
#
# This is a demo: nothing is ever captured. The order is created, the visitor logs
# in to PayPal and approves, and that is where it stops — no money moves, in
# sandbox or anywhere else. See PaypalClient, which has no capture call at all.
#
# Defaults live in PaypalProperties; override any of them here or in .env:
#   app.paypal.api-base-url=https://api-m.sandbox.paypal.com   (live: https://api-m.paypal.com)
#   app.paypal.currency=EUR
#   app.paypal.brand-name=AuthAndSecurity
#
# Absolute base URL PayPal sends the visitor back to. Unset, it is built from the
# incoming request — right locally, wrong behind a proxy that sends no forwarded
# headers, where PayPal would be handed an internal hostname:
#   app.paypal.app-base-url=https://app.example.com
#
# The receiving PayPal address. Normally leave this unset: an order created with a
# given client id is already payable to the account that owns it. Naming a
# *different* account needs a partner arrangement, and a plain REST app that tries
# gets the order rejected outright:
#   app.paypal.payee-email=me@example.com
#
# What a pack costs and how many tokens it grants is not configurable on purpose —
# see the TokenPack enum. A price that could be set from outside the code is a
# price that has one more place to be got wrong.

# --- Saved furniture pictures --------------------------------------------------
# A 1024x1024 image comfortably clears Boot's 1MB default max-file-size, so this
# is sized for that plus headroom rather than left unbounded.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB