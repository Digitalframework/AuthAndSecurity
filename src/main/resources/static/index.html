<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AuthAndSecurity</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
            background: Canvas;
            color: CanvasText;
        }
        .card {
            width: min(420px, calc(100vw - 2rem));
            padding: 2rem;
            border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
            border-radius: 12px;
            text-align: center;
        }
        h1 { margin: 0 0 1.5rem; font-size: 1.25rem; }
        .avatar { width: 72px; height: 72px; border-radius: 50%; }
        .name { margin: 1rem 0 0.25rem; font-weight: 600; }
        .muted { color: color-mix(in srgb, CanvasText 60%, transparent); font-size: 0.9rem; }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
    </style>
</head>
<body>
<main class="card">
    <h1>AuthAndSecurity</h1>
    <div id="content" class="muted">Loading&hellip;</div>
</main>
<script>
    const content = document.getElementById('content');

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }

    function renderSignedOut() {
        content.replaceChildren(
            el('p', 'muted', 'You are not signed in.'),
            Object.assign(el('a', 'btn', 'Sign in with Google'), {
                href: '/oauth2/authorization/google'
            })
        );
    }

    function renderSignedIn(me) {
        const nodes = [];
        if (me.picture) {
            const avatar = el('img', 'avatar');
            avatar.src = me.picture;
            avatar.alt = '';
            nodes.push(avatar);
        }
        nodes.push(el('p', 'name', me.name || 'Signed in'));
        if (me.email) nodes.push(el('p', 'muted', me.email));

        const button = el('button', 'btn', 'Sign out');
        button.addEventListener('click', signOut);
        nodes.push(button);

        content.replaceChildren(...nodes);
    }

    async function signOut() {
        // Logout is a POST and CSRF protection is on, so fetch the token first.
        const csrf = await (await fetch('/api/csrf')).json();
        await fetch('/logout', {
            method: 'POST',
            headers: { [csrf.headerName]: csrf.token }
        });
        window.location.assign('/');
    }

    async function load() {
        const me = await (await fetch('/api/me')).json();
        if (me.authenticated) renderSignedIn(me); else renderSignedOut();
    }

    load().catch(() => {
        content.replaceChildren(el('p', 'muted', 'Could not reach the server.'));
    });
</script>
</body>
</html>
