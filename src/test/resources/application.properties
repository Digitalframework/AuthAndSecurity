# Overrides src/main/resources/application.properties for tests only.
#
# Without this every test would try to reach the real PostgreSQL server named
# there, and would fail on a machine that has none — or, far worse, would pass on
# one that does, having written to it. H2 gives each run an empty schema of its
# own instead.
spring.datasource.url=jdbc:h2:mem:authandsecurity;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
